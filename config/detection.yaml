# YOLOv11m 仪表检测模型训练配置
# 使用 YOLOv11 Medium 模型以获得更高精度

# 模型配置
model: 'yolo11m.pt'  # YOLOv11 medium模型，平衡精度与速度

# 训练基本参数
epochs: 200              # 训练轮数（增加以获得更好收敛）
batch_size: 16           # 批大小（根据GPU/MPS内存调整）
image_size: 640          # 输入图像大小
learning_rate: 0.01      # 初始学习率
weight_decay: 0.0005     # 权重衰减
momentum: 0.937          # SGD动量
patience: 30             # 早停耐心值
save_period: 10          # 模型保存间隔
experiment_name: 'yolo11m_meter_detection'  # 实验名称

# 数据集配置 - Roboflow gauge detection dataset
dataset_root: 'data/gauge.v4-release-640.coco'
# Roboflow格式：每个split目录下有 _annotations.coco.json
train_coco_json: 'data/gauge.v4-release-640.coco/train/_annotations.coco.json'
valid_coco_json: 'data/gauge.v4-release-640.coco/valid/_annotations.coco.json'
test_coco_json: 'data/gauge.v4-release-640.coco/test/_annotations.coco.json'
yolo_output: 'data/gauge_yolo'
use_roboflow_format: true  # 使用Roboflow的预分割格式
seed: 42                 # 随机种子

# 设备和性能配置
device: 'auto'           # 自动检测：CUDA/MPS/CPU
workers: 4               # 数据加载器工作进程数
cos_lr: true             # 使用余弦学习率调度
close_mosaic: 15         # 最后15个epoch关闭mosaic增强
amp: true                # 自动混合精度训练

# 数据增强配置（针对仪表检测优化）
augmentation:
  # 颜色空间增强
  hsv_h: 0.015           # 色调增强范围
  hsv_s: 0.7             # 饱和度增强范围
  hsv_v: 0.4             # 亮度增强范围

  # 几何变换增强
  degrees: 10.0          # 旋转角度范围（度）- 仪表可能有角度变化
  translate: 0.1         # 平移范围
  scale: 0.5             # 缩放范围
  shear: 2.0             # 剪切角度范围
  perspective: 0.0       # 透视变换概率

  # 翻转增强
  flipud: 0.0            # 上下翻转概率（仪表通常不翻转）
  fliplr: 0.5            # 左右翻转概率

  # 混合增强
  mosaic: 1.0            # Mosaic增强概率
  mixup: 0.1             # MixUp增强概率
  copy_paste: 0.1        # Copy-Paste增强概率

# 验证和评估配置
validation:
  conf_threshold: 0.25   # 置信度阈值
  iou_threshold: 0.45    # NMS IoU阈值
  max_det: 300           # 最大检测数量

# 损失函数权重
loss_weights:
  box: 7.5               # 边界框损失权重
  cls: 0.5               # 分类损失权重
  dfl: 1.5               # 分布损失权重

# 优化器配置
optimizer:
  type: 'AdamW'          # 优化器类型
  lr0: 0.01              # 初始学习率
  lrf: 0.01              # 最终学习率因子
  weight_decay: 0.0005   # 权重衰减

# 学习率调度器
lr_scheduler:
  type: 'cosine'         # 学习率调度类型
  warmup_epochs: 3       # 预热轮数
  warmup_momentum: 0.8   # 预热动量
  warmup_bias_lr: 0.1    # 预热偏置学习率

# 模型导出配置
export:
  formats: ['onnx', 'torchscript']
  optimize: true
  half: false
  int8: false
  dynamic: true          # 支持动态输入尺寸
  simplify: true

# 日志和可视化配置
logging:
  log_level: 'INFO'
  save_plots: true
  save_predictions: true

# 特定于仪表检测的配置
meter_detection:
  min_meter_size: 32     # 最小仪表尺寸（像素）
  max_meter_size: 800    # 最大仪表尺寸（像素）
  aspect_ratio_range: [0.5, 2.0]  # 宽高比范围

# 回调函数配置
callbacks:
  early_stopping:
    enabled: true
    patience: 30
    min_delta: 0.001

  model_checkpoint:
    save_best_only: true
    save_weights_only: false
